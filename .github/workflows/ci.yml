name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      # Core plus what the tests import directly: the web server and the Google
      # libraries. The other optional modules gate themselves off when their
      # dependencies are absent, which is the path CI should exercise.
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/core.txt
          pip install -r requirements/web.txt
          pip install -r requirements/server.txt
          pip install -r requirements/google.txt

      - name: Byte-compile
        run: python -m compileall -q helpers modules scripts tests wony.py tray_app.py setup.py

      - name: Test
        run: python -m unittest discover -s tests -t . -v
