name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Core only. The optional feature modules gate themselves off when their
      # dependencies are absent, which is exactly the path CI should exercise.
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/core.txt
          pip install -r requirements/web.txt
          pip install -r requirements/scheduler.txt

      - name: Byte-compile
        run: python -m compileall -q helpers modules scripts tests wony.py tray_app.py setup.py

      - name: Test
        run: python -m unittest discover -s tests -t . -v
