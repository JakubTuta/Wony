name: CI

on:
  push:
    branches: [main, raspberry-pi]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      # Core plus what the tests import directly: the web server and the Google
      # libraries. The other optional modules gate themselves off when their
      # dependencies are absent, which is the path CI should exercise.
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/core.txt
          pip install -r requirements/server.txt
          pip install -r requirements/google.txt

      - name: Byte-compile
        run: python -m compileall -q helpers modules tests wony.py setup.py kiosk/tools

      - name: Test
        run: python -m unittest discover -s tests -t . -v

  screen:
    runs-on: ubuntu-latest
    env:
      # No display on a runner: Qt draws into memory, on the CPU.
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # What PySide6's Qt needs on a bare runner to start at all.
      - name: System libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt
          pip install -r requirements/dev-screen.txt

      # A QML mistake is a blank screen on the device, the hardest place to
      # notice it. Any warning fails the build (kiosk/.qmllint.ini sets what counts).
      - name: Lint the QML
        run: pyside6-qmllint -W 0 $(find kiosk -name '*.qml')

      - name: Test the panel's logic
        run: node --test kiosk/tests/*.test.mjs

      # Loads the real Main.qml against a fixture API, walks every tab and sheet,
      # and taps a few things.
      - name: Test the panel
        run: python -m unittest tests.test_screen -v
