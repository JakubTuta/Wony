name: CI

on:
  push:
    branches: [main, raspberry-pi]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      # Core only. The optional feature modules gate themselves off when their
      # dependencies are absent, which is exactly the path CI should exercise.
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/core.txt
          pip install -r requirements/web.txt
          pip install -r requirements/server.txt

      - name: Byte-compile
        run: python -m compileall -q helpers modules tests wony.py setup.py

      - name: Test
        run: python -m unittest discover -s tests -t . -v

  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kiosk/package-lock.json

      # The touch UI is a built artifact the server hands out. A type error here
      # is a blank screen on the device, which is the hardest place to notice it.
      - name: Build the touch UI
        working-directory: kiosk
        run: |
          npm ci
          npm run build
