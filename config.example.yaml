# Wony settings. Everything here can also be changed on the Settings screen.
# API keys and passwords live in .env, not here.
# Not sure something works? Run:  python wony.py doctor

assistant:
  name: "Wony"
  owner_name: "User"
  # How Wony should talk to you, in your own words.
  personality: "Friendly and concise."
  # Where this device is, for local weather. Leave empty and Wony guesses from
  # the internet connection, which is good to roughly the city.
  home_address: ""
  proactive:
    # Let Wony speak up on its own: a nearly full disk, the device running hot,
    # a meeting about to start, important mail. Ask "what do you watch for" to
    # see the list.
    enabled: false
  memory:
    # Let Wony work out facts about you from your conversations (and, with Gmail
    # on, how you write from your sent mail) without being asked. While off it
    # remembers only what you tell it to. Ask "what do you know about me" to see
    # and correct what it kept.
    learn_from_my_data: false

ai:
  # Which service answers: anthropic, gemini, ollama, or null to use whichever
  # key is in .env. Claude and Gemini always use their fastest model.
  provider: null
  ollama_model: "llama3.1"  # only used with ollama
  history:
    max_turns: 5   # how many past exchanges Wony keeps in mind during a chat

# Which features are on. A feature that is missing a key or a sign-in tells you
# what it needs. Ask Wony "check my setup" to see.
enabled_modules:
  - basics         # time and date, sleep, power off or restart this device
  - routines       # named sets of steps, like the morning briefing
  - scheduler      # timers, alarms and reminders
  - notes          # shopping and todo lists
  - weather        # weather now and the next few days
  # - system         # disk space, memory, processor load, temperature
  # - spotify        # play, pause, skip, search, volume
  # - gmail          # read, search and write email
  # - calendar       # your Google Calendar
  # - google_accounts  # add and sign in to Google accounts from the screen
  # - home_assistant # lights, blinds, heating and more through Home Assistant

modules:
  basics:
    # Let Wony power off or restart this device from the screen.
    allow_power_off: false
  home_assistant:
    # The address you open Home Assistant at in a browser.
    base_url: "http://homeassistant.local:8123"
    # Let Wony unlock doors, open the garage and disarm alarms. Lights, blinds
    # and heating work either way.
    allow_locks: false
  gmail:
    # Let Wony send, reply, delete and mark mail as read. While off it saves
    # emails as drafts for you to send yourself.
    allow_write: false
  calendar:
    work_start_hour: 9        # your working day, used when finding free time
    work_end_hour: 18
    # Let Wony create, change and delete events. While off it tells you what
    # to add instead.
    allow_write: false

kiosk:
  # After this many minutes of nobody touching the screen, it switches to a
  # clock. Touching it anywhere brings the home screen back.
  idle_minutes: 15

  # 3 or 4 tiles across on the Home tab.
  home_columns: 3

  # Off: tapping a light, blind, thermostat or vacuum on the panel runs it
  # right away — the tap is the confirmation. On: every device asks first, same
  # as a lock. Locks and alarms always ask, either way.
  confirm_all_devices: false

  # The Home tab's tile layout is arranged by touch (Edit, on the panel
  # itself) and saved on the device, not here — there is nothing to hand-edit.

server:
  # Keep this at 127.0.0.1 unless the screen and Wony run on different machines.
  # The web page has no password, and it can do everything Wony can — send
  # email, delete calendar events, power off the device. It refuses requests
  # from other websites, but any other address hands all of that to whoever can
  # reach the port.
  host: "127.0.0.1"
  port: 8000
