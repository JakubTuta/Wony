# config.example.yaml — copy to config.yaml and fill in your values.
# Secrets (API keys) go in .env, not here.
# Run `python wony.py doctor` to validate your setup.

assistant:
  name: "Wony"
  owner_name: "User"
  # Free-form text injected into AI system prompts.
  personality: "Friendly and concise."
  # Language for AI responses. BCP-47 codes, e.g. "en", "pl".
  language: "en"

ai:
  # Options: anthropic | gemini | ollama | null (auto-detect from .env keys).
  provider: null
  anthropic_model: null   # null = latest
  gemini_model: null      # null = latest
  ollama_model: "llama3.1"  # required when provider is 'ollama'
  # Reasoning policy (all providers):
  #   on (default) — think only on direct knowledge questions; never on
  #                  tool-using steps, so replies stay fast.
  #   off          — never think anywhere (lowest latency).
  thinking: "on"
  history:
    max_turns: 5   # how many past exchanges Wony remembers within a session

# Only listed modules load. A module still won't run if credentials/deps are missing.
# Run "check setup" to see what each broken module needs.
enabled_modules:
  - ai             # always-on: conversation, history, AI provider routing
  - status         # always-on: module health and setup diagnostics
  - basics         # time, date, power off/restart, daily briefing
  - scheduler      # timers, alarms and reminders; can run another job when they fire
  - weather        # current weather and forecasts
  # - spotify        # playback control (play, pause, skip, search, volume)
  # - gmail          # read, search, and monitor Gmail (requires Google OAuth)
  # - calendar       # read Google Calendar events and check availability (requires Google OAuth)
  # - google_accounts  # add and sign in to Google accounts from the screen
  # - home_assistant # Control your whole house through Home Assistant (needs HOME_ASSISTANT_TOKEN)
  # - web            # Web search and URL fetch (pip install -r requirements/web.txt)
  # - mcp            # MCP client: connect external tool servers (pip install mcp)

# Per-module non-secret settings.
modules:
  basics:
    # Safety gate — set to true to let Wony power off or restart this device
    # from the screen.
    allow_power_off: false
  home_assistant:
    # Address of your Home Assistant, exactly as you open it in a browser.
    base_url: "http://homeassistant.local:8123"
    # Safety gate — set to true to let Wony unlock doors, open the garage and
    # disarm alarms. Lights, switches, blinds and thermostats always work.
    allow_locks: false
  weather:
    default_units: "metric"   # metric | imperial
  gmail:
    # Safety gate — set to true to allow sending, replying, and deleting mail.
    # Off, Wony saves a draft in Gmail for you to send yourself.
    allow_write: false
    # Set to true to have AI summarize email lists (sends content to your AI provider).
    use_ai: false
  calendar:
    work_start_hour: 9        # your working day, used when finding free slots
    work_end_hour: 18
    # Safety gate — set to true to allow creating, editing, and deleting events.
    # Note: requires re-authentication after upgrading from the old readonly scope.
    allow_write: false

# The buttons on the home screen. Leave this out and Wony picks a sensible set
# based on which modules you enabled above.
#
#   kind: job     runs a command straight away — instant, and costs nothing.
#   kind: screen  opens a page you can read and press: weather, your day,
#                 your devices.
#   kind: prompt  asks Wony the sentence you write, same as typing it.
#
# tiles:
#   - id: time
#     label: "Time"
#     icon: "🕑"
#     kind: job
#     job: get_datetime
#   - id: joke
#     label: "Joke"
#     icon: "🙂"
#     kind: prompt
#     prompt: "Tell me a short joke."
#   - id: lights
#     label: "Devices"
#     icon: "💡"
#     kind: screen
#     # screen: weather, agenda, reminders, devices, music, accounts,
#     #         notifications, settings or commands
#     screen: devices

kiosk:
  # After this many minutes of nobody touching the screen, it switches to a
  # clock. Touching it anywhere brings the home screen back.
  idle_minutes: 15

  # The Sleep tile has nothing to configure. It asks for a wake time when you
  # tap it and remembers what you answered; how this particular screen is
  # switched off is worked out on the device. See the README.

server:
  # Keep this at 127.0.0.1 unless the screen and Wony run on different machines.
  # The web API has no password, and it can run every command Wony has — send
  # email, delete calendar events, power off the device, erase her memory. Any
  # other address hands all of that to whoever can reach the port.
  host: "127.0.0.1"
  port: 8000

logging:
  keep_days: 14   # log/csv files older than this are deleted at startup
