# Wony settings. Everything here can also be changed on the Settings page.
# API keys and passwords live in .env, not here.
# Not sure something works? Run:  python wony.py doctor

assistant:
  name: "Wony"
  owner_name: "User"
  # How Wony should talk to you, in your own words.
  personality: "Friendly and concise."
  # Language for replies: "en" for English, "pl" for Polish, "de" for German...
  language: "en"
  # Your home address. Used for "near me" when this computer can't tell where
  # it is (Windows location off). Leave empty if you'd rather not say.
  home_address: ""
  proactive:
    # Let Wony speak up on its own: a low battery, a nearly full disk, a meeting
    # about to start, important mail. Ask "what do you watch for" to see the list.
    enabled: false
  memory:
    # Let Wony work out facts about you from your conversations (and, with Gmail
    # on, how you write from your sent mail) without being asked. While off it
    # remembers only what you tell it to. Ask "what do you know about me" to see
    # and correct what it kept.
    learn_from_my_data: false

voice:
  tts_voice: "af_heart"   # the Settings page lists the voices
  speed: 1.0              # 0.5 (slow) to 2.0 (fast)
  volume: 0.6             # 0.0 (silent) to 1.0 (loudest)

  # Which microphone and speakers to use. null follows whatever Windows uses
  # (recommended). Pick another one on the Settings page if the wrong one is used.
  input_device: null
  output_device: null

  stt:
    # How long you can pause (in milliseconds) before Wony treats your sentence
    # as finished. Raise it if Wony cuts you off.
    silence_ms: 700

  hotkeys:
    # Key combination that starts listening, from any app. null switches it off.
    # Use three keys: Windows does not swallow the keys, so a single key like
    # "<home>" also starts listening every time you press it anywhere.
    push_to_talk: "<ctrl>+<alt>+w"

  conversation:
    # Keep listening after a reply, so you can carry on without the hotkey or
    # wake word. Say "thanks" or "stop" to end.
    enabled: true
    follow_up_timeout: 3.0  # seconds of silence before Wony stops listening

  barge_in:
    # Talking over a reply stops it.
    enabled: true

  media_pause:
    # Pause Spotify, videos and other players while Wony talks or listens.
    enabled: true

  wake_word:
    # Start a conversation hands-free by saying the phrase.
    enabled: false
    # Built in: "hey jarvis", "alexa", "hey mycroft", "hey rhasspy".
    # For your own phrase, run:  python setup.py wakeword
    phrase: "hey jarvis"
    threshold: 0.5   # lower reacts more easily, and more often by mistake

ai:
  # Which service answers: anthropic, gemini, ollama, or null to use whichever
  # key is in .env. Claude and Gemini always use their fastest model.
  provider: null
  ollama_model: "llama3.1"  # only used with ollama
  history:
    max_turns: 5   # how many past exchanges Wony keeps in mind during a chat

# Which features are on. A feature that is missing a key or a sign-in tells you
# what it needs. Ask Wony "check my setup" to see.
enabled_modules:
  - basics         # time and date, shut down or lock the PC
  - routines       # named sets of steps, like the morning briefing
  - scheduler      # timers, alarms and reminders
  - notes          # shopping and todo lists
  - weather        # weather now and the next few days
  # - system         # battery, disk space, memory, network
  # - spotify        # play, pause, skip, search, volume
  # - screen         # look at the screen and read text on it
  # - gmail          # read, search and write email
  # - calendar       # your Google Calendar
  # - drive          # find and read your Google Drive files, edit Docs and Sheets
  # - contacts       # look people up; email and invite them by name
  # - google_accounts  # use more than one Google account
  # - league         # League of Legends: launch the game, accept queue pop-ups
  # - shazam         # name the song that is playing
  # - home_assistant # lights, blinds, heating and more through Home Assistant
  # - maps           # places near you and travel times
  # - web            # search the web and read pages
  # - desktop        # open apps and windows, clipboard, files
  # - mcp            # connect extra tool servers

modules:
  home_assistant:
    # The address you open Home Assistant at in a browser.
    base_url: "http://homeassistant.local:8123"
    # Let Wony unlock doors, open the garage and disarm alarms. Lights, blinds
    # and heating work either way.
    allow_locks: false
  gmail:
    # Let Wony send, reply, delete and mark mail as read. While off it saves
    # emails as drafts for you to send yourself.
    allow_write: false
  calendar:
    work_start_hour: 9        # your working day, used when finding free time
    work_end_hour: 18
    # Let Wony create, change and delete events, and send invitations to the
    # people on them. While off it tells you what to add instead.
    allow_write: false
  drive:
    # Let Wony create Google Docs, add to Docs and Sheets, and upload files.
    # While off it can find and read your files, and tells you what it would write.
    allow_write: false
  desktop:
    # Let Wony type, click, write to the clipboard and change files. While off
    # it can look at the screen and read files, but not act on them.
    allow_actions: false
    # Send the title of the window in front to your AI provider with every
    # message, so "what does this mean" has something to point at. Window
    # titles name documents, browser tabs and who you are chatting to.
    share_window_title: false
  maps:
    # How you usually get around: car, public transport, walking or cycling.
    travel_mode: "car"
  mcp:
    # Let Wony start tool servers itself. These are programs that run on this
    # computer. While off it tells you the command instead.
    allow_install: false

tray:
  notify_on_ready: true          # show a notification when Wony has started
  open_browser_on_start: false   # open the web page when Wony starts

models:
  # Load the speech models when Wony starts: the first reply is faster, but
  # they hold memory the whole time. Off loads them the first time you talk.
  preload: false
